name: CI

on:
  push:
    # Un push qui ne touche QUE de la prose ne compile rien de different : il
    # payait quand meme la matrice complete. Mesure du 2026-07-29 : un push
    # coute ~150 minutes de quota facturees (Windows ~22 min reelles x2,
    # macOS ~11 min x10), et deux des dix runs de la journee ne portaient que
    # du markdown. Un push mixte prose+code passe toujours par la CI : ce
    # filtre ne s'applique que si TOUS les chemins modifies matchent.
    paths-ignore:
      - '**.md'
      - 'proof/**'
  workflow_dispatch:

# Trois runs ont tourne en parallele sur cette branche le 2026-07-29, dont deux
# deja perimes par le commit suivant, sans que rien ne les annule. Un resultat
# qui porte sur du code qu'on vient de remplacer ne sert a rien -- sauf a
# consommer du quota.
#
# Contrepartie nommee, pas cachee : pousser un second commit avant la fin du
# premier run DETRUIT le resultat du premier. Sur une branche ou chaque commit
# est une experience distincte dont on lit la sortie (les iterations RTSan de
# cette journee), c'est un vrai cout. Il reste inferieur a celui de payer des
# runs perimes, et `workflow_dispatch` permet de relancer a la demande le
# resultat qu'on aurait voulu garder.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # FetchContent (JUCE + clap-juce-extensions) is the slow part of every
      # configure; cache it keyed on CMakeLists.txt so a pin bump busts the
      # cache but nothing else does.
      - name: cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt') }}

      # windows-latest's installed Visual Studio version drifts over time
      # (verified 2026-07-29: the image ships VS 18/2026, not VS 17/2022 --
      # asking CMake for a generator that isn't the instance actually present
      # fails hard with "could not find any instance of Visual Studio"). Let
      # CMake's default-generator detection pick whatever is really there
      # instead of hardcoding a version tied to when this file was written.
      # TUPLE_BUILD_PROOF_HOSTS=ON here (it stays OFF for the macOS "build/"
      # tree, whose proof-host coverage comes from "build-rtsan/" instead):
      # tools/proof_hosts/clap_host_smoke.cpp now has a #if defined(_WIN32)
      # branch, and the only way that branch stays compilable is if some leg of
      # this matrix actually compiles it.
      - name: configure (Windows, MSVC, default generator)
        if: runner.os == 'Windows'
        shell: bash
        run: cmake -B build -A x64 -DTUPLE_BUILD_PROOF_HOSTS=ON

      - name: configure (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTUPLE_BUILD_PROOF_HOSTS=OFF

      # --- Step 2: domain + app test binaries, bloquant ---------------------
      - name: build fast test binaries
        shell: bash
        run: |
          cmake --build build --config Release \
            --target DomainTests VoicingTests GridTests NoteoffTests ParamsTests \
            --parallel

      - name: run fast test binaries
        shell: bash
        run: |
          set -e
          if [ "${{ runner.os }}" = "Windows" ]; then
            bindir="build/Release"
          else
            bindir="build"
          fi
          for t in DomainTests VoicingTests GridTests NoteoffTests ParamsTests; do
            exe="$bindir/$t"
            [ "${{ runner.os }}" = "Windows" ] && exe="$exe.exe"
            echo "::group::$t"
            "$exe"
            echo "::endgroup::"
          done

      # --- Step 3: RealtimeSanitizer, the proof of the audio-thread invariants
      #
      # Verified 2026-07-29 against real GitHub-hosted runners (throwaway
      # probe workflow, deleted): `-fsanitize=realtime` is rejected outright
      # ("unsupported option ... for target") on BOTH x86_64-pc-windows-msvc
      # (clang-cl 20.1.8, the LLVM already on windows-latest's PATH) and on
      # Apple's bundled clang (arm64-apple-darwin, Xcode 26.5). It DOES work
      # with a genuine upstream LLVM/clang toolchain on macOS (`brew install
      # llvm` -> clang 22.1.8): compiling and running a throwaway function
      # marked `[[clang::nonblocking]]` that calls malloc() aborted with a
      # real "RealtimeSanitizer: unsafe-library-call" report (exit 134), and
      # the same function with no allocation ran clean (exit 0). So: macOS
      # via brew LLVM is the only runner where this sanitizer is available at
      # all -- Windows is skipped, explicitly and loudly, per Global
      # Constraints, rather than silently.
      - name: RTSan not available on Windows (explicit, not silent)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "::notice title=RTSan skipped on Windows::-fsanitize=realtime is rejected by clang-cl 20.1.8 for target x86_64-pc-windows-msvc ('unsupported option'), verified against this exact runner image on 2026-07-29. RealtimeSanitizer has no Windows/MSVC-ABI target support upstream. This is a known, permanent constraint of this runner, not a flake -- macOS is the only leg of this matrix that runs RTSan."

      - name: install a real LLVM (macOS system clang cannot build RTSan)
        # always(): this is the entry point of the RTSan check group, which
        # must run independently of Step 2 (fast tests) failing -- see the
        # "no single failure hides another check" note on Steps 4/5 below.
        if: always() && runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LLVM_PREFIX=$(brew --prefix llvm)" >> "$GITHUB_ENV"

      - name: RTSan self-test (proves the sanitizer itself works on this runner)
        if: runner.os == 'macOS'
        run: |
          set -e
          mkdir -p rtsan_selftest
          cat > rtsan_selftest/main.cpp <<'EOF'
          #include <cstdlib>
          #include <cstdio>
          // Suffix placement is required -- [[clang::nonblocking]] is a
          // function-TYPE attribute (like noexcept), not a declaration
          // attribute; a prefix placement is rejected by the compiler
          // (verified 2026-07-29 against this exact toolchain).
          void violatesRealtime() [[clang::nonblocking]] {
              void* p = malloc(16);
              free(p);
          }
          void cleanRealtime() [[clang::nonblocking]] {
              // no allocation, syscall, or lock -> must pass under RTSan.
          }
          int main(int argc, char** argv) {
              if (argc > 1 && argv[1][0] == 'v') { violatesRealtime(); return 0; }
              cleanRealtime();
              return 0;
          }
          EOF
          "$LLVM_PREFIX/bin/clang++" -std=c++17 -fsanitize=realtime \
            rtsan_selftest/main.cpp -o rtsan_selftest/probe

          ./rtsan_selftest/probe c
          echo "OK: clean nonblocking path did not trip RTSan (exit 0, as expected)"

          if ./rtsan_selftest/probe v; then
            echo "::error::RTSan self-test FAILED: a malloc() inside a [[clang::nonblocking]] function was NOT caught. The sanitizer is not doing its job on this runner -- treat every other RTSan result on this leg as untrustworthy until this is fixed."
            exit 1
          fi
          echo "OK: RTSan caught the deliberate malloc() violation and aborted, as expected."

      # The coverage gap this step used to merely WARN about is closed:
      # TupleProcessor::processBlock now carries TUPLE_NONBLOCKING
      # ([[clang::nonblocking]], see source/plugin/RealtimeAnnotations.h), so
      # the sanitizer is finally told which function is the real-time context.
      # The step stays, inverted: it now FAILS if the annotation disappears,
      # because losing it would turn every RTSan check below into a green no-op
      # rather than an error.
      #
      # A scan that finds nothing and a scan that is broken produce the same
      # output, so the file count is printed and a zero sweep is itself a
      # failure -- the absence is only meaningful once the sweep is proven.
      - name: RTSan annotation coverage (must find the audio-thread entry point)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          scanned=$(find source tests -type f | wc -l | tr -d ' ')
          echo "source/ + tests/ files swept: $scanned"
          if [ "$scanned" -eq 0 ]; then
            echo "::error title=Annotation scan is broken, not the code::The sweep covered 0 files under source/ and tests/. Refusing to draw any conclusion about annotation coverage from an empty scan."
            exit 1
          fi

          echo "Files carrying the annotation (directly or via the TUPLE_NONBLOCKING macro):"
          { grep -rln "TUPLE_NONBLOCKING\|clang::nonblocking" source tests || true; } | tee rtsan-annotated-files.txt
          count=$(wc -l < rtsan-annotated-files.txt | tr -d ' ')
          echo "annotated files: $count"

          if [ "$count" -eq 0 ]; then
            echo "::error title=RTSan annotation vanished::No file under source/ or tests/ carries the annotation any more. Every RTSan step below would still go green while nothing is ever in real-time context."
            exit 1
          fi

          # Named explicitly rather than "at least one file somewhere": the
          # entry point is the whole point. RealtimeAnnotations.h alone
          # matching would satisfy a bare count while processBlock sat
          # unannotated.
          for f in source/plugin/PluginProcessor.h source/plugin/PluginProcessor.cpp; do
            if ! grep -q "TUPLE_NONBLOCKING" "$f"; then
              echo "::error title=processBlock is no longer annotated::$f does not mention TUPLE_NONBLOCKING. The audio-thread entry point must carry it on BOTH its declaration and its definition (it is part of the function type)."
              exit 1
            fi
          done
          echo "OK: TupleProcessor::processBlock carries TUPLE_NONBLOCKING on declaration and definition."

      # --- Step 3 continued: TUPLE_RTSAN wired into an actual CI build -------
      # Corrects a real gap: the option existed in CMakeLists.txt since Task 1
      # specifically for this job to use, but until now no configure line in
      # this file ever passed -DTUPLE_RTSAN=ON -- only the throwaway self-test
      # above ran under -fsanitize=realtime, never a line of Tuple's own code.
      # A brand-new build tree (not "build/", which stays the plain
      # Xcode-AppleClang build the rest of this job -- including clap-
      # validator/pluginval's Steps 4/5 -- already relies on) avoids any risk
      # of reusing object files compiled by a different compiler than the one
      # actually configured this run.
      #
      # CMAKE_AR/CMAKE_RANLIB must be forced too, not just the compilers.
      # Diagnosed live on run 30433235344: forcing only CMAKE_CXX_COMPILER/
      # CMAKE_C_COMPILER let CMake's own compiler-adjacent detection resolve
      # CMAKE_RANLIB to the Homebrew keg's llvm-ranlib, but CMAKE_AR still
      # fell back to Apple's /usr/bin/ar (the Homebrew llvm keg is keg-only,
      # not on PATH -- see the "install a real LLVM" step's brew output --
      # so a plain `ar` lookup never finds Homebrew's copy). Apple's ar and
      # Homebrew's llvm-ranlib disagree on the archive it produced, and
      # linking failed with: `llvm-ranlib: error: unable to load
      # 'libTuple_SharedCode.a': file too small to be an archive`. Pinning
      # both tools to the same Homebrew LLVM keg removes the mismatch.
      # TUPLE_BUILD_PROOF_HOSTS=ON here, unlike the plain "build/" tree: the two
      # smoke hosts are the only hosts on this runner that CAN execute an
      # RTSan-instrumented plugin, because CMakeLists.txt builds them with
      # -fsanitize=realtime themselves, putting the sanitizer runtime in the
      # main executable image at launch. A pre-built host cannot -- see the
      # note where the old pluginval-on-RTSan step used to be.
      - name: configure + build TupleVST + proof hosts under RTSan (real code, real flags)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p proof
          cmake -B build-rtsan -DCMAKE_BUILD_TYPE=Release \
            -DTUPLE_BUILD_PROOF_HOSTS=ON -DTUPLE_RTSAN=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DCMAKE_AR="$LLVM_PREFIX/bin/llvm-ar" \
            -DCMAKE_RANLIB="$LLVM_PREFIX/bin/llvm-ranlib"
          cmake --build build-rtsan --config Release \
            --target TupleVST_VST3 TupleVST_CLAP TupleVST3HostSmoke TupleClapHostSmoke \
            --parallel 2>&1 | tee proof/rtsan-build-${{ matrix.os }}.log

      # This step used to be an `echo "OK: ... compiled with -fsanitize=realtime"`.
      # That was an assertion, not a measurement, and it was wrong to trust it:
      # on run 30467546532 the whole RTSan leg went green up to the sabotage
      # witness, which then proved a deliberate malloc() inside processBlock was
      # never caught. The echo had happily claimed instrumentation the binaries
      # may not have carried. It is replaced by four facts read off the actual
      # artefacts, each of them bloquant.
      - name: verify the RTSan build is really instrumented (measured, not asserted)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          host="build-rtsan/TupleVST3HostSmoke_artefacts/Release/TupleVST3HostSmoke"
          claphost="build-rtsan/TupleClapHostSmoke"
          plug="build-rtsan/TupleVST_artefacts/Release/VST3/Tuple.vst3/Contents/MacOS/Tuple"
          out="proof/rtsan-instrumentation-${{ matrix.os }}.txt"
          : > "$out"

          {
            echo "=== compile command actually used for PluginProcessor.cpp ==="
            jq -r '.[] | select(.file | endswith("PluginProcessor.cpp")) | .command' \
              build-rtsan/compile_commands.json || echo "(compile_commands.json unreadable)"
            for target in "$host" "$claphost" "$plug"; do
              echo "=== otool -L $target ==="
              otool -L "$target" 2>&1 | sed -n '2,$p' | grep -i "rtsan" || echo "(no rtsan runtime in this image)"
              echo "=== undefined __rtsan_* symbols in $target ==="
              nm -u "$target" 2>/dev/null | grep -i "rtsan" | head -10 || echo "(none)"
            done
          } | tee -a "$out"

          fail=0

          # 1. The plugin's own translation unit must have been given both the
          #    sanitizer flag and the TUPLE_RTSAN define, or the annotation and
          #    the sabotage witness are compiled out of existence.
          cmd=$(jq -r '.[] | select(.file | endswith("PluginProcessor.cpp")) | .command' build-rtsan/compile_commands.json)
          case "$cmd" in
            *-fsanitize=realtime*) echo "OK: PluginProcessor.cpp compiled with -fsanitize=realtime" ;;
            *) echo "::error title=Plugin code is not instrumented::PluginProcessor.cpp was compiled WITHOUT -fsanitize=realtime. Every RTSan result in this job would be vacuous."; fail=1 ;;
          esac
          case "$cmd" in
            *TUPLE_RTSAN*) echo "OK: PluginProcessor.cpp compiled with TUPLE_RTSAN defined" ;;
            *) echo "::error title=TUPLE_RTSAN not defined::PluginProcessor.cpp was compiled without -DTUPLE_RTSAN, so the sabotage witness does not exist in this binary and cannot fail."; fail=1 ;;
          esac

          # 2. The compiled plugin must actually reference the runtime entry
          #    points the attribute is supposed to emit. This is what proves
          #    [[clang::nonblocking]] survived all the way to codegen.
          if nm -u "$plug" 2>/dev/null | grep -q "__rtsan_realtime_enter"; then
            echo "OK: the built plugin references __rtsan_realtime_enter -- processBlock is instrumented"
          else
            echo "::error title=No realtime-context instrumentation in the plugin::The built plugin has no undefined reference to __rtsan_realtime_enter. [[clang::nonblocking]] did not reach codegen, so nothing ever enters real-time context."
            fail=1
          fi

          # 3. The host that will load it must carry the sanitizer runtime in
          #    its own image, or interceptors are installed too late (the
          #    pluginval failure documented further down).
          if otool -L "$host" | grep -qi "rtsan"; then
            echo "OK: the VST3 proof host links the RealtimeSanitizer runtime itself"
          else
            echo "::error title=Proof host has no sanitizer runtime::TupleVST3HostSmoke was linked without -fsanitize=realtime, so the runtime would only arrive via the plugin's dlopen -- too late to install interceptors, exactly the failure mode that makes pluginval unusable here."
            fail=1
          fi

          exit $fail

      # Clang's function-effects analysis is the COMPILE-TIME half of
      # [[clang::nonblocking]]; the runtime sanitizer is the other half, and
      # they fail independently (source/plugin/RealtimeAnnotations.h). This
      # step surfaces the static half instead of letting it scroll past in a
      # build log. It is deliberately NON-blocking: the analysis cannot see
      # through virtual dispatch, so every call into JUCE (AudioPlayHead::
      # getPosition() and friends) is "unproven", which is not the same claim
      # as "unsafe". The blocking signal is the runtime result below.
      - name: function-effects diagnostics from the RTSan build (informational)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          log="proof/rtsan-build-${{ matrix.os }}.log"
          out="proof/rtsan-function-effects-${{ matrix.os }}.txt"
          if [ ! -f "$log" ]; then
            echo "::error::no RTSan build log at $log -- the build step above did not run to completion, so this summary would be silently empty."
            exit 1
          fi
          { grep -n "function-effects\|nonblocking\|nonallocating" "$log" || true; } | tee "$out"

          # Split ours from the vendored dependency's own. JUCE's
          # juce_audio_devices sources carry four "attribute 'nonblocking'
          # should not be added via type conversion" warnings of their own,
          # in CoreAudio/CoreMidi code Tuple neither wrote nor calls. Counting
          # them together would inflate our number and hide movement in it.
          warnings=$({ grep "warning:" "$out" || true; })
          ours=$(printf '%s\n' "$warnings" | { grep -c "tuple-vst/source/" || true; })
          vendored=$(printf '%s\n' "$warnings" | { grep -vc "tuple-vst/source/" || true; })
          echo "function-effects warnings -- Tuple's own code: $ours ; vendored (JUCE): $vendored"

          if [ "$ours" -gt 0 ]; then
            echo "::warning title=$ours call site(s) in Tuple's own code are unproven::'Unproven', not 'proven unsafe'. Measured on run 30471091956, every one of them is a call into a JUCE type -- MidiMessage's constructors/destructor, MidiBuffer::addEvent/clear/swapWith, AudioBuffer::clear, and AudioPlayHead::getPosition (virtual, host-supplied, unprovable by construction). No warning remains about a Tuple function calling another Tuple function: annotating decideTransportStop and releaseAll made Clang verify their bodies and both came back clean. Full list in $out. The bloquant signal is the runtime RTSan result below."
          else
            echo "Clang raised no function-effects warning on Tuple's own code."
          fi

      - name: run proof hosts against the RTSan build (real execution of processBlock)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p proof
          vst3="build-rtsan/TupleVST_artefacts/Release/VST3/Tuple.vst3"
          clap="build-rtsan/TupleVST_artefacts/Release/CLAP/Tuple.clap"
          vst3host="build-rtsan/TupleVST3HostSmoke_artefacts/Release/TupleVST3HostSmoke"
          claphost="build-rtsan/TupleClapHostSmoke"
          for p in "$vst3" "$clap" "$vst3host" "$claphost"; do
            if [ ! -e "$p" ]; then
              echo "::error::RTSan build artefact missing: $p"
              find build-rtsan -maxdepth 4 -name 'Tuple*' | head -40
              exit 1
            fi
          done
          echo "RTSAN_VST3=$vst3" >> "$GITHUB_ENV"
          echo "RTSAN_VST3_HOST=$vst3host" >> "$GITHUB_ENV"

          echo "::group::VST3 proof host, RTSan build"
          "$vst3host" "$vst3" 2>&1 | tee "proof/rtsan-vst3-host-smoke-${{ matrix.os }}.txt"
          echo "::endgroup::"

          echo "::group::CLAP proof host, RTSan build"
          "$claphost" "$clap" 2>&1 | tee "proof/rtsan-clap-host-smoke-${{ matrix.os }}.txt"
          echo "::endgroup::"

          echo "OK: both formats loaded, TupleProcessor::processBlock executed end-to-end with RealtimeSanitizer active, no violation reported."

      # A passing RTSan run and a RTSan run that instruments nothing look
      # identical from outside. This step plants a witness so they cannot:
      # the SAME binary that just exited 0 is re-run with TUPLE_RTSAN_SABOTAGE
      # set, which arms a deliberate malloc() inside processBlock (compiled in
      # only under -DTUPLE_RTSAN=ON, never in a shipped build -- see
      # PluginProcessor.h). If that run does NOT abort, the annotation is not
      # reaching the runtime and the clean run above proved nothing.
      - name: RTSan witness -- the same binary must abort when sabotage is armed
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          out="proof/rtsan-sabotage-${{ matrix.os }}.txt"
          TUPLE_RTSAN_SABOTAGE=1 "$RTSAN_VST3_HOST" "$RTSAN_VST3" > "$out" 2>&1
          rc=$?
          cat "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error title=RTSan instrumentation is not reaching Tuple's code::The armed sabotage run exited 0. A malloc() inside TupleProcessor::processBlock was NOT caught, so the [[clang::nonblocking]] context is never entered and every other RTSan result in this run is untrustworthy."
            exit 1
          fi
          if ! grep -q "RealtimeSanitizer" "$out"; then
            echo "::error title=Sabotage run aborted for the wrong reason::exit code $rc but no RealtimeSanitizer report in the output. Something other than the sanitizer killed it; treat this as a broken check, not a pass."
            exit 1
          fi
          echo "OK: armed run aborted with a RealtimeSanitizer report (exit $rc). The annotation reaches the runtime in the real plugin, so the clean run above is a real result."

      # --- Steps 4 & 5: the actual shipped plugin, both formats -------------
      #
      # always() on this step and everything through the pluginval steps
      # below: these are independent bloquant checks from RTSan (Step 3) and
      # from the fast tests (Step 2) -- they build from "build/", a tree
      # RTSan's own "build-rtsan/" never touches -- so a failure in either of
      # those must not hide whether the plugin itself still builds and
      # validates. Verified live on run 30433235344: without always() here,
      # RTSan's link failure on macOS skipped every step below it, including
      # this one, clap-validator, and pluginval -- three previously-working
      # checks going dark with zero signal. If "build" itself was never
      # configured (e.g. the configure step upstream genuinely failed), this
      # step now fails loudly with cmake's own error instead of silently
      # skipping -- that IS a genuine dependency, not the bug above, but it
      # must still be a visible failure, not a skip.
      - name: build plugin formats (VST3 + CLAP)
        if: always()
        shell: bash
        run: cmake --build build --config Release --target TupleVST_VST3 TupleVST_CLAP --parallel

      - name: locate plugin artefacts
        if: always()
        shell: bash
        run: |
          set -e
          vst3="build/TupleVST_artefacts/Release/VST3/Tuple.vst3"
          clap="build/TupleVST_artefacts/Release/CLAP/Tuple.clap"
          [ -e "$vst3" ] || { echo "::error::VST3 artefact not found at $vst3"; exit 1; }
          [ -e "$clap" ] || { echo "::error::CLAP artefact not found at $clap"; exit 1; }
          echo "VST3_PATH=$vst3" >> "$GITHUB_ENV"
          echo "CLAP_PATH=$clap" >> "$GITHUB_ENV"
          mkdir -p proof

      # Windows is where RTSan does NOT exist, so this leg cannot prove
      # anything about the audio thread. What it does prove is that the
      # _WIN32 branch of tools/proof_hosts/clap_host_smoke.cpp still compiles
      # and still loads both formats after the dlopen/dlsym port -- otherwise
      # that branch would only ever be exercised on a dev machine, by hand,
      # which is how it drifted into "Windows-only, macOS pending" in the
      # first place.
      - name: proof hosts (Windows, no sanitizer -- load path only)
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          cmake --build build --config Release \
            --target TupleVST3HostSmoke TupleClapHostSmoke --parallel
          vst3host="build/TupleVST3HostSmoke_artefacts/Release/TupleVST3HostSmoke.exe"
          claphost="build/Release/TupleClapHostSmoke.exe"
          for p in "$vst3host" "$claphost"; do
            if [ ! -e "$p" ]; then
              echo "::error::proof host binary missing: $p"
              find build -maxdepth 4 -iname '*HostSmoke*' | head -20
              exit 1
            fi
          done
          echo "::group::VST3 proof host"
          "$vst3host" "$VST3_PATH" 2>&1 | tee "proof/host-smoke-vst3-${{ matrix.os }}.txt"
          echo "::endgroup::"
          echo "::group::CLAP proof host"
          "$claphost" "$CLAP_PATH" 2>&1 | tee "proof/host-smoke-clap-${{ matrix.os }}.txt"
          echo "::endgroup::"

      - name: download clap-validator (latest release)
        if: always()
        shell: bash
        run: |
          set -e
          api="https://api.github.com/repos/free-audio/clap-validator/releases/latest"
          if [ "${{ runner.os }}" = "Windows" ]; then suffix="windows.zip"; else suffix="macos-universal.zip"; fi
          url=$(curl -sSL -H "Authorization: Bearer ${{ github.token }}" "$api" \
            | jq -r --arg s "$suffix" '.assets[] | select(.name | endswith($s)) | .browser_download_url')
          echo "clap-validator asset: $url"
          [ -n "$url" ] || { echo "::error::no clap-validator asset matched suffix $suffix"; exit 1; }
          curl -sSL -o cv.zip "$url"
          mkdir -p tools/clap-validator-bin
          (cd tools/clap-validator-bin && cmake -E tar xf ../../cv.zip)
          # The .zip asset's own name says "0.4.1", but the file it contains
          # is a nested "clap-validator-0.3.2-...-macos-universal.tar.gz" --
          # verified 2026-07-29 by an actual download, not documented
          # upstream. Unpack any nested archive before hunting for the exe.
          for f in $(find tools/clap-validator-bin -type f \( -iname "*.tar.gz" -o -iname "*.tgz" \)); do
            (cd "$(dirname "$f")" && cmake -E tar xf "$(basename "$f")")
          done
          bin=$(find tools/clap-validator-bin -type f -iname "clap-validator*" \
            ! -iname "*.zip" ! -iname "*.tar.gz" ! -iname "*.tgz" | head -1)
          [ -n "$bin" ] || { echo "::error::clap-validator binary not found after extraction"; find tools/clap-validator-bin; exit 1; }
          chmod +x "$bin" || true
          echo "CLAP_VALIDATOR=$bin" >> "$GITHUB_ENV"

      - name: download pluginval (latest release)
        id: download_pluginval
        if: always()
        shell: bash
        run: |
          set -e
          api="https://api.github.com/repos/Tracktion/pluginval/releases/latest"
          if [ "${{ runner.os }}" = "Windows" ]; then suffix="Windows.zip"; else suffix="macOS.zip"; fi
          url=$(curl -sSL -H "Authorization: Bearer ${{ github.token }}" "$api" \
            | jq -r --arg s "$suffix" '.assets[] | select(.name | endswith($s)) | .browser_download_url')
          echo "pluginval asset: $url"
          [ -n "$url" ] || { echo "::error::no pluginval asset matched suffix $suffix"; exit 1; }
          curl -sSL -o pv.zip "$url"
          mkdir -p tools/pluginval-bin
          (cd tools/pluginval-bin && cmake -E tar xf ../../pv.zip)
          for f in $(find tools/pluginval-bin -type f \( -iname "*.tar.gz" -o -iname "*.tgz" \)); do
            (cd "$(dirname "$f")" && cmake -E tar xf "$(basename "$f")")
          done
          bin=$(find tools/pluginval-bin -type f -iname "pluginval*" \
            ! -iname "*.zip" ! -iname "*.tar.gz" ! -iname "*.tgz" | head -1)
          [ -n "$bin" ] || { echo "::error::pluginval binary not found after extraction"; find tools/pluginval-bin; exit 1; }
          chmod +x "$bin" || true
          echo "PLUGINVAL=$bin" >> "$GITHUB_ENV"

      # --- Step 4: clap-validator on the .clap, bloquant ---------------------
      # always(): independent bloquant check, same reasoning as Steps 4/5
      # above -- must still run (and report) even if RTSan or the fast tests
      # failed earlier in the job. Its own genuine dependency is the CLAP
      # artefact from "locate plugin artefacts" above; if that step didn't
      # run to completion, CLAP_PATH/CLAP_VALIDATOR are unset here -- guarded
      # explicitly below so that shows up as a clear ::error::, not a
      # confusing "no such file" from clap-validator itself or a silent skip.
      - name: clap-validator validate
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mkdir -p proof
          if [ -z "$CLAP_PATH" ] || [ ! -e "$CLAP_PATH" ]; then
            echo "::error::clap-validator validate: no CLAP artefact to validate (CLAP_PATH='$CLAP_PATH') -- the build/locate step above did not produce one. Reporting as a failed check, not a silent skip."
            exit 1
          fi
          if [ -z "$CLAP_VALIDATOR" ] || [ ! -x "$CLAP_VALIDATOR" ]; then
            echo "::error::clap-validator validate: clap-validator binary unavailable (CLAP_VALIDATOR='$CLAP_VALIDATOR') -- the download step above did not succeed."
            exit 1
          fi
          "$CLAP_VALIDATOR" validate "$CLAP_PATH" 2>&1 | tee proof/clap-validator-${{ matrix.os }}.txt
          status=$?
          exit $status

      # --- Step 5: pluginval --strictness-level 5 on the .vst3, bloquant -----
      # Exit code contract: 0 == pass, 1 == fail. Both are meaningful (not a
      # crash/"tool broken" code), so the job fails on anything != 0 without
      # needing to special-case 1 versus e.g. a segfault.
      - name: pluginval --strictness-level 5
        # Independent of clap-validator's result: both are their own
        # bloquant check (Steps 4 and 5), and one failing must not hide
        # whether the other also would have. The job as a whole still
        # reports failure if either step failed. Gated on the download step
        # specifically (not a bare always()) -- verified 2026-07-29: a bare
        # always() here ran with $PLUGINVAL unset whenever an EARLIER step
        # (e.g. Step 2's tests) had already failed, producing a confusing
        # "command not found" (exit 127) instead of a clean skip.
        if: always() && steps.download_pluginval.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p proof
          if [ -z "$VST3_PATH" ] || [ ! -e "$VST3_PATH" ]; then
            echo "::error::pluginval: no VST3 artefact to validate (VST3_PATH='$VST3_PATH') -- the build/locate step above did not produce one. Reporting as a failed check, not a silent skip."
            exit 1
          fi
          "$PLUGINVAL" --strictness-level 5 --validate "$VST3_PATH" 2>&1 | tee proof/pluginval-${{ matrix.os }}.txt
          status=$?
          exit $status

      # --- Removed: "pluginval --strictness-level 5 (RTSan build)" ------------
      #
      # It ran here until 2026-07-29 and could never have worked. A pre-built
      # host has no sanitizer runtime of its own, so RealtimeSanitizer only
      # arrives when the host dlopen()s the instrumented plugin -- far too late
      # to install its interceptors. Measured, not reasoned: run 30437655033,
      # `pluginval --strictness-level 5 --validate build-rtsan/.../Tuple.vst3`
      #
      #   ==17045==ERROR: Interceptors are not working. This may be because
      #   RealtimeSanitizer is loaded too late (e.g. via dlopen). Please launch
      #   the executable with:
      #   DYLD_INSERT_LIBRARIES=.../libclang_rt.rtsan_osx_dynamic.dylib
      #   "interceptors not installed" && 0
      #   pluginval received Abort trap: 6, exiting immediately
      #
      # The sanitizer's own suggested workaround (DYLD_INSERT_LIBRARIES) is not
      # used: dyld strips DYLD_* for hardened-runtime/signed binaries, so a
      # downloaded pluginval.app would make this check pass or vanish depending
      # on how Tracktion signed that release -- a check whose meaning depends on
      # someone else's codesigning is worse than no check.
      #
      # What replaces it is strictly stronger, not a downgrade: the two proof
      # hosts above are built WITH -fsanitize=realtime, so the runtime is in the
      # main image from launch, and they exercise both formats through the real
      # plugin API rather than one. pluginval still runs at strictness 5 against
      # the ordinary (non-RTSan) build, unchanged, as its own bloquant check.

      - name: upload proof/ for this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-${{ matrix.os }}
          path: proof/
          if-no-files-found: warn
