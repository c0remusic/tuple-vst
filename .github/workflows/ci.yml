name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build-and-validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # FetchContent (JUCE + clap-juce-extensions) is the slow part of every
      # configure; cache it keyed on CMakeLists.txt so a pin bump busts the
      # cache but nothing else does.
      - name: cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt') }}

      # windows-latest's installed Visual Studio version drifts over time
      # (verified 2026-07-29: the image ships VS 18/2026, not VS 17/2022 --
      # asking CMake for a generator that isn't the instance actually present
      # fails hard with "could not find any instance of Visual Studio"). Let
      # CMake's default-generator detection pick whatever is really there
      # instead of hardcoding a version tied to when this file was written.
      - name: configure (Windows, MSVC, default generator)
        if: runner.os == 'Windows'
        shell: bash
        run: cmake -B build -A x64 -DTUPLE_BUILD_PROOF_HOSTS=OFF

      - name: configure (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTUPLE_BUILD_PROOF_HOSTS=OFF

      # --- Step 2: domain + app test binaries, bloquant ---------------------
      - name: build fast test binaries
        shell: bash
        run: |
          cmake --build build --config Release \
            --target DomainTests VoicingTests GridTests NoteoffTests ParamsTests \
            --parallel

      - name: run fast test binaries
        shell: bash
        run: |
          set -e
          if [ "${{ runner.os }}" = "Windows" ]; then
            bindir="build/Release"
          else
            bindir="build"
          fi
          for t in DomainTests VoicingTests GridTests NoteoffTests ParamsTests; do
            exe="$bindir/$t"
            [ "${{ runner.os }}" = "Windows" ] && exe="$exe.exe"
            echo "::group::$t"
            "$exe"
            echo "::endgroup::"
          done

      # --- Step 3: RealtimeSanitizer, the proof of the audio-thread invariants
      #
      # Verified 2026-07-29 against real GitHub-hosted runners (throwaway
      # probe workflow, deleted): `-fsanitize=realtime` is rejected outright
      # ("unsupported option ... for target") on BOTH x86_64-pc-windows-msvc
      # (clang-cl 20.1.8, the LLVM already on windows-latest's PATH) and on
      # Apple's bundled clang (arm64-apple-darwin, Xcode 26.5). It DOES work
      # with a genuine upstream LLVM/clang toolchain on macOS (`brew install
      # llvm` -> clang 22.1.8): compiling and running a throwaway function
      # marked `[[clang::nonblocking]]` that calls malloc() aborted with a
      # real "RealtimeSanitizer: unsafe-library-call" report (exit 134), and
      # the same function with no allocation ran clean (exit 0). So: macOS
      # via brew LLVM is the only runner where this sanitizer is available at
      # all -- Windows is skipped, explicitly and loudly, per Global
      # Constraints, rather than silently.
      - name: RTSan not available on Windows (explicit, not silent)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "::notice title=RTSan skipped on Windows::-fsanitize=realtime is rejected by clang-cl 20.1.8 for target x86_64-pc-windows-msvc ('unsupported option'), verified against this exact runner image on 2026-07-29. RealtimeSanitizer has no Windows/MSVC-ABI target support upstream. This is a known, permanent constraint of this runner, not a flake -- macOS is the only leg of this matrix that runs RTSan."

      - name: install a real LLVM (macOS system clang cannot build RTSan)
        # always(): this is the entry point of the RTSan check group, which
        # must run independently of Step 2 (fast tests) failing -- see the
        # "no single failure hides another check" note on Steps 4/5 below.
        if: always() && runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LLVM_PREFIX=$(brew --prefix llvm)" >> "$GITHUB_ENV"

      - name: RTSan self-test (proves the sanitizer itself works on this runner)
        if: runner.os == 'macOS'
        run: |
          set -e
          mkdir -p rtsan_selftest
          cat > rtsan_selftest/main.cpp <<'EOF'
          #include <cstdlib>
          #include <cstdio>
          // Suffix placement is required -- [[clang::nonblocking]] is a
          // function-TYPE attribute (like noexcept), not a declaration
          // attribute; a prefix placement is rejected by the compiler
          // (verified 2026-07-29 against this exact toolchain).
          void violatesRealtime() [[clang::nonblocking]] {
              void* p = malloc(16);
              free(p);
          }
          void cleanRealtime() [[clang::nonblocking]] {
              // no allocation, syscall, or lock -> must pass under RTSan.
          }
          int main(int argc, char** argv) {
              if (argc > 1 && argv[1][0] == 'v') { violatesRealtime(); return 0; }
              cleanRealtime();
              return 0;
          }
          EOF
          "$LLVM_PREFIX/bin/clang++" -std=c++17 -fsanitize=realtime \
            rtsan_selftest/main.cpp -o rtsan_selftest/probe

          ./rtsan_selftest/probe c
          echo "OK: clean nonblocking path did not trip RTSan (exit 0, as expected)"

          if ./rtsan_selftest/probe v; then
            echo "::error::RTSan self-test FAILED: a malloc() inside a [[clang::nonblocking]] function was NOT caught. The sanitizer is not doing its job on this runner -- treat every other RTSan result on this leg as untrustworthy until this is fixed."
            exit 1
          fi
          echo "OK: RTSan caught the deliberate malloc() violation and aborted, as expected."

      - name: RTSan coverage gap (honest, not swept under the rug)
        if: runner.os == 'macOS'
        run: |
          echo "Repo-wide scan for [[clang::nonblocking]] outside .github/ and docs/ (proves the scan ran, not just that it found zero):"
          hits=$(grep -rl "clang::nonblocking" source tests 2>/dev/null || true)
          count=$(printf '%s\n' "$hits" | grep -c . || true)
          echo "source/ + tests/ files scanned: $(find source tests -type f | wc -l | tr -d ' ') ; files with the annotation: $count"
          if [ -z "$hits" ]; then
            echo "::warning title=RTSan has zero coverage today::No file under source/ or tests/ carries [[clang::nonblocking]] yet (verified live above, not from memory). Below this step, the REAL TupleVST plugin (not a throwaway function) is now compiled with -DTUPLE_RTSAN=ON via this same brew LLVM and executed by pluginval, a real host -- so the sanitizer's instrumentation is genuinely present in the shipped code path and genuinely exercised by a host process. But with no annotated entry point (e.g. TupleProcessor::processBlock) the sanitizer's realtime-context flag is still never set, so it cannot flag a single real allocation/syscall/lock in Tuple's own code -- a green run there is proof the PIPELINE compiles and executes real Tuple code under the sanitizer, still NOT proof the audio thread is safe. Tracked gap, unchanged: annotate the real audio-thread entry point(s). Out of scope for this task (.github/workflows/ci.yml only, Task 5's files are already committed)."
          else
            echo "Annotated files: $hits"
          fi

      # --- Step 3 continued: TUPLE_RTSAN wired into an actual CI build -------
      # Corrects a real gap: the option existed in CMakeLists.txt since Task 1
      # specifically for this job to use, but until now no configure line in
      # this file ever passed -DTUPLE_RTSAN=ON -- only the throwaway self-test
      # above ran under -fsanitize=realtime, never a line of Tuple's own code.
      # A brand-new build tree (not "build/", which stays the plain
      # Xcode-AppleClang build the rest of this job -- including clap-
      # validator/pluginval's Steps 4/5 -- already relies on) avoids any risk
      # of reusing object files compiled by a different compiler than the one
      # actually configured this run.
      #
      # CMAKE_AR/CMAKE_RANLIB must be forced too, not just the compilers.
      # Diagnosed live on run 30433235344: forcing only CMAKE_CXX_COMPILER/
      # CMAKE_C_COMPILER let CMake's own compiler-adjacent detection resolve
      # CMAKE_RANLIB to the Homebrew keg's llvm-ranlib, but CMAKE_AR still
      # fell back to Apple's /usr/bin/ar (the Homebrew llvm keg is keg-only,
      # not on PATH -- see the "install a real LLVM" step's brew output --
      # so a plain `ar` lookup never finds Homebrew's copy). Apple's ar and
      # Homebrew's llvm-ranlib disagree on the archive it produced, and
      # linking failed with: `llvm-ranlib: error: unable to load
      # 'libTuple_SharedCode.a': file too small to be an archive`. Pinning
      # both tools to the same Homebrew LLVM keg removes the mismatch.
      - name: configure + build TupleVST (VST3) under RTSan (real code, real flags)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          cmake -B build-rtsan -DCMAKE_BUILD_TYPE=Release \
            -DTUPLE_BUILD_PROOF_HOSTS=OFF -DTUPLE_RTSAN=ON \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DCMAKE_AR="$LLVM_PREFIX/bin/llvm-ar" \
            -DCMAKE_RANLIB="$LLVM_PREFIX/bin/llvm-ranlib"
          cmake --build build-rtsan --config Release --target TupleVST_VST3 --parallel
          echo "OK: TupleVST_VST3 compiled and linked with -fsanitize=realtime, using $LLVM_PREFIX's clang++/clang/llvm-ar/llvm-ranlib throughout (verified via TUPLE_RTSAN's target_compile_options/target_link_options in CMakeLists.txt, not assumed)."

      - name: locate RTSan plugin artefact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          vst3_rtsan="build-rtsan/TupleVST_artefacts/Release/VST3/Tuple.vst3"
          [ -e "$vst3_rtsan" ] || { echo "::error::RTSan VST3 artefact not found at $vst3_rtsan"; exit 1; }
          echo "VST3_PATH_RTSAN=$vst3_rtsan" >> "$GITHUB_ENV"

      # --- Steps 4 & 5: the actual shipped plugin, both formats -------------
      #
      # always() on this step and everything through the pluginval steps
      # below: these are independent bloquant checks from RTSan (Step 3) and
      # from the fast tests (Step 2) -- they build from "build/", a tree
      # RTSan's own "build-rtsan/" never touches -- so a failure in either of
      # those must not hide whether the plugin itself still builds and
      # validates. Verified live on run 30433235344: without always() here,
      # RTSan's link failure on macOS skipped every step below it, including
      # this one, clap-validator, and pluginval -- three previously-working
      # checks going dark with zero signal. If "build" itself was never
      # configured (e.g. the configure step upstream genuinely failed), this
      # step now fails loudly with cmake's own error instead of silently
      # skipping -- that IS a genuine dependency, not the bug above, but it
      # must still be a visible failure, not a skip.
      - name: build plugin formats (VST3 + CLAP)
        if: always()
        shell: bash
        run: cmake --build build --config Release --target TupleVST_VST3 TupleVST_CLAP --parallel

      - name: locate plugin artefacts
        if: always()
        shell: bash
        run: |
          set -e
          vst3="build/TupleVST_artefacts/Release/VST3/Tuple.vst3"
          clap="build/TupleVST_artefacts/Release/CLAP/Tuple.clap"
          [ -e "$vst3" ] || { echo "::error::VST3 artefact not found at $vst3"; exit 1; }
          [ -e "$clap" ] || { echo "::error::CLAP artefact not found at $clap"; exit 1; }
          echo "VST3_PATH=$vst3" >> "$GITHUB_ENV"
          echo "CLAP_PATH=$clap" >> "$GITHUB_ENV"
          mkdir -p proof

      - name: download clap-validator (latest release)
        if: always()
        shell: bash
        run: |
          set -e
          api="https://api.github.com/repos/free-audio/clap-validator/releases/latest"
          if [ "${{ runner.os }}" = "Windows" ]; then suffix="windows.zip"; else suffix="macos-universal.zip"; fi
          url=$(curl -sSL -H "Authorization: Bearer ${{ github.token }}" "$api" \
            | jq -r --arg s "$suffix" '.assets[] | select(.name | endswith($s)) | .browser_download_url')
          echo "clap-validator asset: $url"
          [ -n "$url" ] || { echo "::error::no clap-validator asset matched suffix $suffix"; exit 1; }
          curl -sSL -o cv.zip "$url"
          mkdir -p tools/clap-validator-bin
          (cd tools/clap-validator-bin && cmake -E tar xf ../../cv.zip)
          # The .zip asset's own name says "0.4.1", but the file it contains
          # is a nested "clap-validator-0.3.2-...-macos-universal.tar.gz" --
          # verified 2026-07-29 by an actual download, not documented
          # upstream. Unpack any nested archive before hunting for the exe.
          for f in $(find tools/clap-validator-bin -type f \( -iname "*.tar.gz" -o -iname "*.tgz" \)); do
            (cd "$(dirname "$f")" && cmake -E tar xf "$(basename "$f")")
          done
          bin=$(find tools/clap-validator-bin -type f -iname "clap-validator*" \
            ! -iname "*.zip" ! -iname "*.tar.gz" ! -iname "*.tgz" | head -1)
          [ -n "$bin" ] || { echo "::error::clap-validator binary not found after extraction"; find tools/clap-validator-bin; exit 1; }
          chmod +x "$bin" || true
          echo "CLAP_VALIDATOR=$bin" >> "$GITHUB_ENV"

      - name: download pluginval (latest release)
        id: download_pluginval
        if: always()
        shell: bash
        run: |
          set -e
          api="https://api.github.com/repos/Tracktion/pluginval/releases/latest"
          if [ "${{ runner.os }}" = "Windows" ]; then suffix="Windows.zip"; else suffix="macOS.zip"; fi
          url=$(curl -sSL -H "Authorization: Bearer ${{ github.token }}" "$api" \
            | jq -r --arg s "$suffix" '.assets[] | select(.name | endswith($s)) | .browser_download_url')
          echo "pluginval asset: $url"
          [ -n "$url" ] || { echo "::error::no pluginval asset matched suffix $suffix"; exit 1; }
          curl -sSL -o pv.zip "$url"
          mkdir -p tools/pluginval-bin
          (cd tools/pluginval-bin && cmake -E tar xf ../../pv.zip)
          for f in $(find tools/pluginval-bin -type f \( -iname "*.tar.gz" -o -iname "*.tgz" \)); do
            (cd "$(dirname "$f")" && cmake -E tar xf "$(basename "$f")")
          done
          bin=$(find tools/pluginval-bin -type f -iname "pluginval*" \
            ! -iname "*.zip" ! -iname "*.tar.gz" ! -iname "*.tgz" | head -1)
          [ -n "$bin" ] || { echo "::error::pluginval binary not found after extraction"; find tools/pluginval-bin; exit 1; }
          chmod +x "$bin" || true
          echo "PLUGINVAL=$bin" >> "$GITHUB_ENV"

      # --- Step 4: clap-validator on the .clap, bloquant ---------------------
      # always(): independent bloquant check, same reasoning as Steps 4/5
      # above -- must still run (and report) even if RTSan or the fast tests
      # failed earlier in the job. Its own genuine dependency is the CLAP
      # artefact from "locate plugin artefacts" above; if that step didn't
      # run to completion, CLAP_PATH/CLAP_VALIDATOR are unset here -- guarded
      # explicitly below so that shows up as a clear ::error::, not a
      # confusing "no such file" from clap-validator itself or a silent skip.
      - name: clap-validator validate
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mkdir -p proof
          if [ -z "$CLAP_PATH" ] || [ ! -e "$CLAP_PATH" ]; then
            echo "::error::clap-validator validate: no CLAP artefact to validate (CLAP_PATH='$CLAP_PATH') -- the build/locate step above did not produce one. Reporting as a failed check, not a silent skip."
            exit 1
          fi
          if [ -z "$CLAP_VALIDATOR" ] || [ ! -x "$CLAP_VALIDATOR" ]; then
            echo "::error::clap-validator validate: clap-validator binary unavailable (CLAP_VALIDATOR='$CLAP_VALIDATOR') -- the download step above did not succeed."
            exit 1
          fi
          "$CLAP_VALIDATOR" validate "$CLAP_PATH" 2>&1 | tee proof/clap-validator-${{ matrix.os }}.txt
          status=$?
          exit $status

      # --- Step 5: pluginval --strictness-level 5 on the .vst3, bloquant -----
      # Exit code contract: 0 == pass, 1 == fail. Both are meaningful (not a
      # crash/"tool broken" code), so the job fails on anything != 0 without
      # needing to special-case 1 versus e.g. a segfault.
      - name: pluginval --strictness-level 5
        # Independent of clap-validator's result: both are their own
        # bloquant check (Steps 4 and 5), and one failing must not hide
        # whether the other also would have. The job as a whole still
        # reports failure if either step failed. Gated on the download step
        # specifically (not a bare always()) -- verified 2026-07-29: a bare
        # always() here ran with $PLUGINVAL unset whenever an EARLIER step
        # (e.g. Step 2's tests) had already failed, producing a confusing
        # "command not found" (exit 127) instead of a clean skip.
        if: always() && steps.download_pluginval.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p proof
          if [ -z "$VST3_PATH" ] || [ ! -e "$VST3_PATH" ]; then
            echo "::error::pluginval: no VST3 artefact to validate (VST3_PATH='$VST3_PATH') -- the build/locate step above did not produce one. Reporting as a failed check, not a silent skip."
            exit 1
          fi
          "$PLUGINVAL" --strictness-level 5 --validate "$VST3_PATH" 2>&1 | tee proof/pluginval-${{ matrix.os }}.txt
          status=$?
          exit $status

      # --- Step 3, closing the loop: a real host executes the RTSan build ---
      # clap-validator is deliberately NOT run against build-rtsan: its
      # state-reproducibility failures (Step 4 above) are an already-tracked,
      # unrelated Task 4 bug that reproduces regardless of any sanitizer, so
      # running it a second time here would only add a duplicate, misleading
      # red under the RTSan step's name. pluginval currently passes clean on
      # the non-RTSan build, so a pass/fail here is a meaningful signal about
      # THIS build, not noise from a bug this task does not own.
      - name: pluginval --strictness-level 5 (RTSan build)
        if: always() && runner.os == 'macOS' && steps.download_pluginval.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p proof
          if [ -z "$VST3_PATH_RTSAN" ] || [ ! -e "$VST3_PATH_RTSAN" ]; then
            echo "::error::pluginval (RTSan build): no VST3 artefact to validate (VST3_PATH_RTSAN='$VST3_PATH_RTSAN') -- the RTSan build/locate step above did not produce one. Reporting as a failed check, not a silent skip."
            exit 1
          fi
          "$PLUGINVAL" --strictness-level 5 --validate "$VST3_PATH_RTSAN" 2>&1 | tee proof/pluginval-rtsan-${{ matrix.os }}.txt
          status=$?
          exit $status

      - name: upload proof/ for this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-${{ matrix.os }}
          path: proof/
          if-no-files-found: warn
